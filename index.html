<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />

    <!-- 검색 결과 제외 요청. 검색봇이 이 HTML을 읽을 수 있어야 적용됩니다. -->
    <meta
      name="robots"
      content="noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai"
    />
    <meta name="googlebot" content="noindex, nofollow, nosnippet, noimageindex" />
    <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet, noimageindex" />

    <!-- display 폰트: 메타보다 먼저 연결해 Cormorant·Noto Serif KR을 최대한 빨리 받기 시작 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Serif+KR:wght@400;500;600&display=block"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Noto+Serif+KR:wght@400;500;600&display=block"
    />

    <title>지은 ♥ 재준 결혼식 초대장 · 2026.12.06</title>
    <meta
      name="description"
      content="지은과 재준의 결혼식에 초대합니다. 2026년 12월 6일, 더메리든."
    />
    <meta name="author" content="지은 · 재준" />
    <meta name="theme-color" content="#fffcf7" />
    <!-- AI 크롤링 정책은 도메인 루트 robots.txt에서 관리합니다.
         noai/noimageai는 추가 신호이며 모든 봇의 준수를 보장하지 않습니다. -->

    <!-- 메신저 공유 미리보기 (검색 노출과 별개) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ko_KR" />
    <meta property="og:title" content="지은 ♥ 재준 결혼식 초대장 · 2026.12.06" />
    <meta
      property="og:description"
      content="지은과 재준의 결혼식에 초대합니다. 2026년 12월 6일, 더메리든."
    />
    <meta property="og:site_name" content="지은 ♥ 재준 결혼식 초대장" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="지은 ♥ 재준 결혼식 초대장 · 2026.12.06" />
    <meta
      name="twitter:description"
      content="지은과 재준의 결혼식에 초대합니다. 2026년 12월 6일, 더메리든."
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
